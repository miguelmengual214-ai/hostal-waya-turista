<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hostal Waya</title>
<style>body{font-family:Arial;margin:0;background:#fdf6e3}.hero{background:url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e);background-size:cover;height:260px;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:bold;text-align:center}.card{background:white;margin:15px;padding:15px;border-radius:12px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{background:#ff7f11;color:white;border:none;font-weight:bold;font-size:16px}</style>
</head><body>
<div class="hero">Hostal Waya<br><span style="font-size:16px">Mayapo - Riohacha</span></div>
<div class="card"><h2>Chinchorro con vista al mar</h2><p>$120k / noche - Baño privado, WiFi, ventilador. A 15 min de Riohacha.</p></div>
<div class="card"><h3>Reserva directa - Sin comisiones</h3>
<input id="nombre" placeholder="Tu nombre">
<input id="tel" placeholder="Tu WhatsApp">
<input id="fecha" type="date">
<input id="noches" type="number" placeholder="Cuantas noches?">
<button onclick="reservar()">Reservar por WhatsApp</button>
</div>
<script>
function reservar(){
let n=document.getElementById("nombre").value;
let t=document.getElementById("tel").value;
let f=document.getElementById("fecha").value;
let no=document.getElementById("noches").value;
if(!n||!f){alert("Pon nombre y fecha");return}
let lista=JSON.parse(localStorage.getItem("reservasWaya")||"[]");
lista.push({nombre:n,tel:t,fecha:f,noches:no});
localStorage.setItem("reservasWaya",JSON.stringify(lista));
let msg="Hola Hostal Waya, soy "+n+" quiero "+no+" noches el "+f+" mi numero "+t;
window.open("https://wa.me/573001234567?text="+encodeURIComponent(msg));
alert("Reserva guardada!");
}
</script>
</body></html>
